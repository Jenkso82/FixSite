<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FixSite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: background-color 0.3s, color 0.3s;
            touch-action: none;
        }

        html, body {
            overscroll-behavior: none;
            -webkit-overflow-scrolling: none;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f8f9fa;
            padding: 1rem;
        }

        .container {
            background: #fff;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            border: 1px solid #ddd;
            position: relative;
        }

        .password-container {
            position: relative;
            width: 100%;
            margin-bottom: 1rem;
        }

        .form input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #edf2f4;
            border-radius: 0.8rem;
            font-size: 1rem;
            background: #f8f9fa;
            color: #2b2d42;
            margin-bottom: 0.5rem;
        }

        .form input[type="password"] {
            padding-right: 2.5rem;
        }

        .form input:focus {
            outline: none;
            border-color: #8d99ae;
            background: #fff;
            box-shadow: 0 4px 12px rgba(141, 153, 174, 0.1);
        }

        .form input::placeholder {
            color: #adb5bd;
        }

        .eye-icon {
            position: absolute;
            right: 10px;
            top: 14px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .eye-icon img {
            width: 100%;
            height: 100%;
        }

        .eye-icon:hover {
            opacity: 0.7;
        }

        .tooltip.error {
            font-size: 0.75rem;
            color: #e63946;
            margin-bottom: 0.5rem;
            text-align: left;
            display: none;
            width: 100%;
        }

        .tooltip.error.active {
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.5rem;
                border-radius: 1rem;
                max-width: 100%;
                margin: 0 0.5rem;
            }
        }

        .form {
            display: none;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form.active {
            display: flex;
        }

        .form h2 {
            color: #2b2d42;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            text-align: center;
        }

        .form button {
            padding: 0.8rem;
            background: #8d99ae;
            color: white;
            border: none;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .form button:hover:not(:disabled) {
            background: #6c757d;
            box-shadow: 0 6px 16px rgba(108, 117, 125, 0.2);
        }

        .form button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        .switch-form-text {
            text-align: center;
            margin-top: 1rem;
            color: #666;
        }

        .switch-form-text a {
            color: #8d99ae;
            text-decoration: none;
            font-weight: 600;
        }

        .switch-form-text a:hover {
            color: #2b2d42;
        }

        .card {
            width: 80%;
            max-width: 300px;
            background-color: white;
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
            position: relative;
        }

        .icon {
            position: relative;
            margin: -4rem auto 2rem;
        }

        .title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-align: center;
            color: #4b5563;
        }

        .description {
            width: 100%;
            margin-bottom: 2.5rem;
            font-size: 0.875rem;
            text-align: center;
            color: #4b5563;
        }

        .privacy-link {
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #634647;
        }

        .privacy-link:hover {
            color: #845556;
            text-decoration: underline;
        }

        .more-options {
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: #4b5563;
            cursor: pointer;
            font-weight: 600;
            position: absolute;
            left: 1.5rem;
            bottom: 1.5rem;
            background: transparent;
            border: 0;
        }

        .more-options:hover {
            color: #634647;
            text-decoration: underline;
        }

        .accept-button {
            position: absolute;
            right: 1.5rem;
            bottom: 1.5rem;
            padding: 0.5rem 2rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: #634647;
            background-color: #ddad81;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
        }

        .accept-button:hover {
            background-color: #634647;
            color: #ddad81;
        }

        .theme-switcher {
            position: fixed;
            top: 1rem;
            left: 1rem;
            background: #8d99ae;
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-weight: 600;
            z-index: 1000;
        }

        .theme-switcher:hover {
            background: #6c757d;
        }

        body.dark-theme {
            background: #121212;
            color: #ffffff;
        }

        body.dark-theme .container {
            background: #1e1e1e;
            border-color: #333333;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        body.dark-theme .form input {
            background: #2c2c2c;
            border-color: #ffffff;
            color: #ffffff;
        }

        body.dark-theme .form input:focus {
            border-color: #bbbbbb;
            background: #333333;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        body.dark-theme .form input::placeholder {
            color: #bbbbbb;
        }

        body.dark-theme .form button {
            background: #ffffff;
            color: #121212;
        }

        body.dark-theme .form button:hover:not(:disabled) {
            background: #e0e0e0;
            box-shadow: 0 6px 16px rgba(255, 255, 255, 0.2);
        }

        body.dark-theme .form h2 {
            color: #ffffff;
        }

        body.dark-theme .switch-form-text {
            color: #bbbbbb;
        }

        body.dark-theme .switch-form-text a {
            color: #ffffff;
        }

        body.dark-theme .switch-form-text a:hover {
            color: #e0e0e0;
        }

        body.dark-theme .card {
            background: #1e1e1e;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        body.dark-theme .title,
        body.dark-theme .description,
        body.dark-theme .privacy-link,
        body.dark-theme .more-options {
            color: #ffffff;
        }

        body.dark-theme .privacy-link:hover {
            color: #e0e0e0;
        }

        body.dark-theme .more-options:hover {
            color: #e0e0e0;
        }

        body.dark-theme .accept-button {
            background: #ffffff;
            color: #121212;
        }

        body.dark-theme .accept-button:hover {
            background: #e0e0e0;
            color: #121212;
        }

        @keyframes fadeInDark {
            0% { background-color: #f8f9fa; }
            100% { background-color: #121212; }
        }

        @keyframes fadeInLight {
            0% { background-color: #121212; }
            100% { background-color: #f8f9fa; }
        }
    </style>
</head>

                <div class="eye-icon">

                <p class="title">Ваша конфиденциальность важна для нас</p>
                <p class="description">
                    Мы обрабатываем вашу личную информацию для улучшения наших сервисов.<br>Подробности в нашей <a href="https://telegra.ph/Politika-konfidencialnosti-SilentHub-03-18" class="privacy-link">Политике конфиденциальности</a>.

                <button class="more-options" onclick="window.location.href='https://telegra.ph/Politika-konfidencialnosti-SilentHub-03-18'">Подробнее</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        function resetFormInputs(form) {
            const inputs = form.querySelectorAll('input');
            inputs.forEach(input => {
                input.value = '';
                input.type = input.id.includes('password') ? 'password' : input.type;
            });
            form.querySelectorAll('.tooltip.error').forEach(error => {
                error.classList.remove('active');
                error.textContent = '';
            });
        }

        function toggleLogin() {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            registerForm.classList.remove('active');
            loginForm.classList.add('active');
            resetFormInputs(loginForm);
        }

        function toggleRegister() {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            loginForm.classList.remove('active');
            registerForm.classList.add('active');
            resetFormInputs(registerForm);
        }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const eyeIcon = input.nextElementSibling;
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            eyeIcon.querySelector('.eye-open').style.display = isPassword ? 'none' : 'block';
            eyeIcon.querySelector('.eye-closed').style.display = isPassword ? 'block' : 'none';
        }

        function hideCookie() {
            const cookieCard = document.getElementById('cookie-card');
            cookieCard.style.opacity = '0';
            cookieCard.style.transform = 'translate(-50%, -60%)';
            setTimeout(() => {
                cookieCard.style.display = 'none';
            }, 300);
        }

        function toggleTheme() {
            const body = document.body;
            const themeSwitcher = document.getElementById('theme-switcher');
            if (body.classList.contains('dark-theme')) {
                body.style.animation = 'fadeInLight 0.5s ease-in-out forwards';
                body.classList.remove('dark-theme');
                themeSwitcher.textContent = 'Темная тема';
                localStorage.setItem('theme', 'light');
                setTimeout(() => body.style.animation = '', 500);
            } else {
                body.style.animation = 'fadeInDark 0.5s ease-in-out forwards';
                body.classList.add('dark-theme');
                themeSwitcher.textContent = 'Светлая тема';
                localStorage.setItem('theme', 'dark');
                setTimeout(() => body.style.animation = '', 500);
            }
        }

        function vibrate() {
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.classList.add('active');
        }

        function clearErrors(formId) {
            const form = document.getElementById(formId);
            form.querySelectorAll('.tooltip.error').forEach(error => {
                error.classList.remove('active');
                error.textContent = '';
            });
        }

        function validateEmail(email) {
            const gmailRegex = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
            return gmailRegex.test(email);
        }

        function validateUsername(username) {
            return username.length >= 3;
        }

        async function getEmailByUsername(username) {
            const usersRef = doc(db, "usernames", username);
            const docSnap = await getDoc(usersRef);
            if (docSnap.exists()) {
                return docSnap.data().email;
            }
            return null;
        }

        function validateLoginForm(identifier, password) {
            let isValid = true;
            clearErrors('login-form');

            if (!identifier) {
                showError('login-identifier-error', 'Введите логин или email');
                isValid = false;
            }

            if (!password) {
                showError('login-password-error', 'Введите пароль');
                isValid = false;
            } else if (password.length < 6) {
                showError('login-password-error', 'Пароль должен быть не менее 6 символов');
                isValid = false;
            }

            return isValid;
        }

        function validateRegisterForm(username, email, password) {
            let isValid = true;
            clearErrors('register-form');

            if (!username) {
                showError('register-username-error', 'Введите логин');
                isValid = false;
            } else if (!validateUsername(username)) {
                showError('register-username-error', 'Логин должен быть не менее 3 символов');
                isValid = false;
            }

            if (!email) {
                showError('register-email-error', 'Введите email');
                isValid = false;
            } else if (!validateEmail(email)) {
                showError('register-email-error', 'Используйте только @gmail.com адрес');
                isValid = false;
            }

            if (!password) {
                showError('register-password-error', 'Введите пароль');
                isValid = false;
            } else if (password.length < 6) {
                showError('register-password-error', 'Пароль должен быть не менее 6 символов');
                isValid = false;
            }

            return isValid;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const registerButton = document.getElementById('register-button');
            const loginButton = document.getElementById('login-button');
            registerButton.disabled = true;
            loginButton.disabled = true;

            const username = document.getElementById('register-username').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value.trim();

            if (!validateRegisterForm(username, email, password)) {
                vibrate();
                registerButton.disabled = false;
                loginButton.disabled = false;
                return;
            }

            try {
                const usernameDoc = await getDoc(doc(db, "usernames", username));
                if (usernameDoc.exists()) {
                    showError('register-username-error', 'Этот логин уже занят');
                    vibrate();
                    registerButton.disabled = false;
                    loginButton.disabled = false;
                    return;
                }

                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await setDoc(doc(db, "users", user.uid), {
                    username: username,
                    email: email,
                    verify: false,
                    createdAt: new Date()
                });

                await setDoc(doc(db, "usernames", username), {
                    email: email,
                    userId: user.uid
                });

                window.location.href = 'index.html';
            } catch (error) {
                vibrate();
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        showError('register-email-error', 'Этот email уже зарегистрирован');
                        break;
                    case 'auth/invalid-email':
                        showError('register-email-error', 'Некорректный email');
                        break;
                    default:
                        showError('register-email-error', 'Ошибка: ' + error.message);
                }
            } finally {
                registerButton.disabled = false;
                loginButton.disabled = false;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const loginButton = document.getElementById('login-button');
            const registerButton = document.getElementById('register-button');
            loginButton.disabled = true;
            registerButton.disabled = true;

            let identifier = document.getElementById('login-identifier').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!validateLoginForm(identifier, password)) {
                vibrate();
                loginButton.disabled = false;
                registerButton.disabled = false;
                return;
            }

            try {
                if (!identifier.includes('@')) {
                    const email = await getEmailByUsername(identifier);
                    if (!email) {
                        showError('login-identifier-error', 'Логин не найден');
                        vibrate();
                        loginButton.disabled = false;
                        registerButton.disabled = false;
                        return;
                    }
                    identifier = email;
                }

                await signInWithEmailAndPassword(auth, identifier, password);
                window.location.href = 'index.html';
            } catch (error) {
                vibrate();
                switch (error.code) {
                    case 'auth/user-not-found':
                    case 'auth/wrong-password':
                        showError('login-password-error', 'Неверный логин/email или пароль');
                        break;
                    case 'auth/invalid-email':
                        showError('login-identifier-error', 'Некорректный email');
                        break;
                    default:
                        showError('login-identifier-error', 'Ошибка: ' + error.message);
                }
            } finally {
                loginButton.disabled = false;
                registerButton.disabled = false;
            }
        }

        window.onload = function() {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            resetFormInputs(loginForm);
            resetFormInputs(registerForm);

            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-theme');
                document.getElementById('theme-switcher').textContent = 'Светлая тема';
            }

            document.querySelector('#to-register').addEventListener('click', (e) => {
                e.preventDefault();
                toggleRegister();
            });

            document.querySelector('#to-login').addEventListener('click', (e) => {
                e.preventDefault();
                toggleLogin();
            });

            document.querySelectorAll('.eye-icon').forEach(icon => {
                icon.addEventListener('click', () => {
                    const inputId = icon.previousElementSibling.id;
                    togglePassword(inputId);
                });
            });

            document.querySelector('.accept-button').addEventListener('click', hideCookie);

            document.getElementById('theme-switcher').addEventListener('click', toggleTheme);

            document.querySelectorAll('button').forEach(button => {
                button.addEventListener('click', vibrate);
            });

            document.getElementById('login-form').addEventListener('submit', handleLogin);
            document.getElementById('register-form').addEventListener('submit', handleRegister);

            document.addEventListener('touchstart', (e) => {
                if (!e.target.closest('input, button, a')) {
                    document.activeElement.blur();
                }
            });

            document.addEventListener('gesturestart', (e) => e.preventDefault());
            document.addEventListener('touchmove', (e) => {
                if (e.scale !== 1) e.preventDefault();
            }, { passive: false });
        };
    </script>
</body>
</html>
