<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SilentHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f8f9fa;
            padding: 1rem;
            overflow: hidden;
            transition: background-color 0.5s ease-in-out;
        }

        .container {
            background: #fff;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            border: 1px solid #ddd;
            position: relative;
        }

        .password-container {
            position: relative;
            width: 100%;
        }

        .form input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #edf2f4;
            border-radius: 0.8rem;
            font-size: 1rem;
            background: #f8f9fa;
            color: #2b2d42;
        }

        .form input[type="password"] {
            padding-right: 2.5rem;
        }

        .form input:focus {
            outline: none;
            border-color: #8d99ae;
            background: #fff;
            box-shadow: 0 4px 12px rgba(141, 153, 174, 0.1);
        }

        .form input::placeholder {
            color: #adb5bd;
        }

        .eye-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .eye-icon img {
            width: 100%;
            height: 100%;
        }

        .eye-icon:hover {
            opacity: 0.7;
        }

        .tooltip.error {
            font-size: 0.8rem;
            color: #e63946;
            margin-top: 0.2rem;
            text-align: left;
            display: none;
        }

        .tooltip.error.active {
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.5rem;
                border-radius: 1rem;
                max-width: 100%;
                margin: 0 0.5rem;
            }
        }

        .form {
            display: none;
            flex-direction: column;
            gap: 1rem;
        }

        .form.active {
            display: flex;
        }

        .form h2 {
            color: #2b2d42;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            text-align: center;
        }

        .form button {
            padding: 0.8rem;
            background: #8d99ae;
            color: white;
            border: none;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .form button:hover {
            background: #6c757d;
            box-shadow: 0 6px 16px rgba(108, 117, 125, 0.2);
        }

        .switch-form-text {
            text-align: center;
            margin-top: 1rem;
            color: #666;
        }

        .switch-form-text a {
            color: #8d99ae;
            text-decoration: none;
            font-weight: 600;
        }

        .switch-form-text a:hover {
            color: #2b2d42;
        }

        .card {
            width: 80%;
            max-width: 300px;
            background-color: white;
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
            position: relative;
        }

        .icon {
            position: relative;
            margin: -4rem auto 2rem;
        }

        .title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-align: center;
            color: #4b5563;
        }

        .description {
            width: 100%;
            margin-bottom: 2.5rem;
            font-size: 0.875rem;
            text-align: center;
            color: #4b5563;
        }

        .privacy-link {
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #634647;
        }

        .privacy-link:hover {
            color: #845556;
            text-decoration: underline;
        }

        .more-options {
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: #4b5563;
            cursor: pointer;
            font-weight: 600;
            position: absolute;
            left: 1.5rem;
            bottom: 1.5rem;
            background: transparent;
            border: 0;
        }

        .more-options:hover {
            color: #634647;
            text-decoration: underline;
        }

        .accept-button {
            position: absolute;
            right: 1.5rem;
            bottom: 1.5rem;
            padding: 0.5rem 2rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: #634647;
            background-color: #ddad81;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
        }

        .accept-button:hover {
            background-color: #634647;
            color: #ddad81;
        }

        .theme-switcher {
            position: fixed;
            top: 1rem;
            left: 1rem;
            background: #8d99ae;
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-weight: 600;
            z-index: 1000;
        }

        .theme-switcher:hover {
            background: #6c757d;
        }

        body.dark-theme {
            background: #121212;
            color: #ffffff;
        }

        body.dark-theme .container {
            background: #1e1e1e;
            border-color: #333333;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        body.dark-theme .form input {
            background: #2c2c2c;
            border-color: #ffffff;
            color: #ffffff;
        }

        body.dark-theme .form input:focus {
            border-color: #bbbbbb;
            background: #333333;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        body.dark-theme .form input::placeholder {
            color: #bbbbbb;
        }

        body.dark-theme .form button {
            background: #ffffff;
            color: #121212;
        }

        body.dark-theme .form button:hover {
            background: #e0e0e0;
            box-shadow: 0 6px 16px rgba(255, 255, 255, 0.2);
        }

        body.dark-theme .form h2 {
            color: #ffffff;
        }

        body.dark-theme .switch-form-text {
            color: #bbbbbb;
        }

        body.dark-theme .switch-form-text a {
            color: #ffffff;
        }

        body.dark-theme .switch-form-text a:hover {
            color: #e0e0e0;
        }

        body.dark-theme .card {
            background: #1e1e1e;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        body.dark-theme .title,
        body.dark-theme .description,
        body.dark-theme .privacy-link,
        body.dark-theme .more-options {
            color: #ffffff;
        }

        body.dark-theme .privacy-link:hover {
            color: #e0e0e0;
        }

        body.dark-theme .more-options:hover {
            color: #e0e0e0;
        }

        body.dark-theme .accept-button {
            background: #ffffff;
            color: #121212;
        }

        body.dark-theme .accept-button:hover {
            background: #e0e0e0;
            color: #121212;
        }

        @keyframes fadeInDark {
            0% { background-color: #f8f9fa; }
            100% { background-color: #121212; }
        }

        @keyframes fadeInLight {
            0% { background-color: #121212; }
            100% { background-color: #f8f9fa; }
        }
    </style>
</head>

        <form id="login-form" class="form active">
            <h2>Вход в аккаунт</h2>
            <div>

            </div>

                    <img src="https://i.postimg.cc/C1shtnWk/hidden.png" border="0" alt="hidden" class="eye-closed" style="display: none;">
                </div>
                <div class="tooltip error" id="login-password-error"></div>
            </div>
            <button type="submit" id="login-button">Войти</button>
            <div class="switch-form-text">
                Нет аккаунта? <a href="#" id="to-register">Зарегистрируйтесь</a>
            </div>
        </form>

        <form id="register-form" class="form">
            <h2>Создать аккаунт</h2>
            <input type="text" placeholder="Логин" id="register-username">

            <input type="email" placeholder="Электронная почта" id="register-email">
            <div class="tooltip error" id="register-email-error"></div>
            <div class="password-container">
                <input type="password" placeholder="Пароль" id="register-password">
                <div class="eye-icon">
                    <img src="https://i.postimg.cc/YCTCmH6G/eye.png" border="0" alt="eye" class="eye-open" style="display: block;">
                    <img src="https://i.postimg.cc/C1shtnWk/hidden.png" border="0" alt="hidden" class="eye-closed" style="display: none;">
                </div>
                <div class="tooltip error" id="register-password-error"></div>
            </div>
            <button type="submit" id="register-button">Зарегистрироваться</button>
            <div class="switch-form-text">
                Уже есть аккаунт? <a href="#" id="to-login">Войдите</a>
